<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Screens - BookMyTicket Admin</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
	rel="stylesheet">

<style>
:root {
	--bg-main: #0f172a;
	--bg-card: #111827;
	--border: #1f2937;
	--text-main: #e5e7eb;
	--text-muted: #9ca3af;
	--accent: #6496ff;
	--accent-pink: #ff4081;
}

* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: "Poppins", sans-serif;
	background: radial-gradient(circle at top, #1e293b, var(--bg-main));
	min-height: 100vh;
	color: var(--text-main);
}

/* NAVBAR */
.navbar {
	background: rgba(17, 24, 39, .88);
	backdrop-filter: blur(14px);
	border-bottom: 1px solid var(--border);
	padding: 15px 0;
}

.navbar-brand {
	font-weight: 900;
	font-size: 1.5rem;
	background: linear-gradient(135deg, var(--accent),
		var(--accent-pink));
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
}

.nav-link {
	color: var(--text-muted) !important;
	font-weight: 500;
	margin-left: 20px;
	transition: .3s;
}

.nav-link:hover {
	color: var(--accent-pink) !important;
}

/* MAIN */
.admin-container {
	padding: 40px 20px;
	max-width: 1200px;
	margin: auto;
}

.admin-header {
	margin-bottom: 40px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 20px;
}

.admin-header h1 {
	font-weight: 800;
	font-size: 2rem;
	color: var(--text-main);
}

/* BUTTONS */
.back-link, .add-btn {
	background: linear-gradient(135deg, var(--accent),
		var(--accent-pink));
	color: #fff !important;
	text-decoration: none;
	padding: 11px 24px;
	border-radius: 12px;
	font-weight: 700;
	border: none;
	transition: .3s;
}

.back-link:hover, .add-btn:hover {
	transform: translateY(-2px);
	box-shadow: 0 12px 25px rgba(100, 150, 255, .35);
}

/* TABLE */
.table-wrapper {
	background: linear-gradient(180deg, #111827, #0b1220);
	border: 1px solid var(--border);
	border-radius: 18px;
	overflow: hidden;
	box-shadow: 0 20px 45px rgba(0, 0, 0, .55);
}

.table {
	margin-bottom: 0;
	color: var(--text-main);
}

.table thead th {
	background: linear-gradient(135deg, var(--accent),
		var(--accent-pink));
	color: white;
	font-weight: 700;
	border: none;
	padding: 18px 16px;
	font-size: .92rem;
	text-transform: uppercase;
}

.table tbody td {
	padding: 16px;
	border-color: var(--border);
	vertical-align: middle;
	font-weight: 500;
}

.table tbody td {
	padding: 16px;
	border-color: rgba(100, 150, 255, 0.1);
	vertical-align: middle;
	font-weight: 500;
	color: #1a2332 !important;
}

.table tbody tr:hover {
	background: rgba(255,255,255,.03);
}

.screen-name {
	color: #1a2332 !important;
	font-weight: 700;
}

.screen-type {
	background: rgba(100, 150, 255, .15);
	color: var(--accent);
	padding: 6px 12px;
	border-radius: 8px;
	font-size: .85rem;
	font-weight: 700;
}

/* ACTION BUTTONS */
.action-cell {
	display: flex;
	gap: 6px;
	flex-wrap: wrap;
}

.btn-edit, .btn-delete, .btn-manage {
	padding: 8px 12px;
	border-radius: 8px;
	font-weight: 700;
	font-size: .8rem;
	text-decoration: none;
	transition: .3s;
	color: white;
	border: none;
}

.btn-edit {
	background: linear-gradient(135deg, #6496ff, #4a78ff);
}

.btn-delete {
	background: linear-gradient(135deg, #ff4d6d, #ff1e56);
}

.btn-manage {
	background: linear-gradient(135deg, #00bcd4, #0097a7);
}

.btn-edit:hover, .btn-delete:hover, .btn-manage:hover {
	transform: translateY(-2px);
	box-shadow: 0 10px 18px rgba(0,0,0,.3);
}

/* EMPTY STATE */
.empty-state {
	text-align: center;
	padding: 80px 20px;
	background: linear-gradient(180deg, #111827, #0b1220);
	border: 1px solid var(--border);
	border-radius: 18px;
}

.empty-state-title {
	font-size: 1.5rem;
	font-weight: 700;
	color: var(--text-main);
	margin-bottom: 12px;
}

.empty-state-text {
	color: var(--text-muted);
	margin-bottom: 30px;
}

/* TOAST */
.toastify-container {
	position: fixed;
	top: 20px;
	right: 20px;
	z-index: 9999;
}

.toastify {
	min-width: 300px;
	padding: 14px 18px;
	border-radius: 12px;
	display: flex;
	gap: 12px;
	color: #fff;
	font-weight: 600;
	box-shadow: 0 20px 45px rgba(0, 0, 0, .7);
	animation: slideIn .4s ease;
}

.toastify.success {
	background: linear-gradient(135deg, #22c55e, #16a34a);
}

.toastify.error {
	background: linear-gradient(135deg, #ff4081, #ff6a6a);
}

.toastify-close {
	background: rgba(255,255,255,.25);
	border: none;
	width: 26px;
	height: 26px;
	border-radius: 50%;
	color: white;
	font-weight: 700;
}

/* ANIMATIONS */
@keyframes slideIn {
	from {
		transform: translateX(400px);
		opacity: 0;
	}
	to {
		transform: translateX(0);
		opacity: 1;
	}
}

/* RESPONSIVE */
@media(max-width:768px) {

	.admin-header {
		flex-direction: column;
		align-items: flex-start;
	}

	.action-cell {
		flex-direction: column;
		width: 100%;
	}

	.btn-edit,
	.btn-delete,
	.btn-manage {
		width: 100%;
		text-align: center;
	}
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<nav class="navbar navbar-expand-lg">
		<div class="container-fluid">
			<a class="navbar-brand" href="/">📽️ BookMyTicket</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" href="/">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="/manage-users">Manage
							Users</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<!-- TOASTS -->
	<div class="toastify-container">
		<div th:if="${pass}" class="toastify success">
			<span th:text="${pass}"></span>
		</div>
		<div th:if="${fail}" class="toastify error">
			<span th:text="${fail}"></span>
		</div>
	</div>

	<!-- MAIN CONTENT -->
	<div class="admin-container">
		<div class="admin-header">
			<h1>🎬 Manage Screens</h1>
			<a th:href="'/add-screen/'+${id}" class="add-btn">+ Add Screen</a>
		</div>

		<!-- EMPTY STATE -->
		<div th:if="${screens.isEmpty()}" class="empty-state">
			<div class="empty-state-icon">🎞️</div>
			<div class="empty-state-title">No Screens Yet</div>
			<p class="empty-state-text">Create your first screen to start
				managing shows and seats.</p>
			<a th:href="'/add-screen/'+${id}" class="add-btn">+ Add Your
				First Screen</a>
		</div>

		<!-- TABLE -->
		<div th:if="${!screens.isEmpty()}" class="table-wrapper">
			<table class="table">
				<thead>
					<tr>
						<th>Name</th>
						<th>Type</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="screen : ${screens}">
						<td><span class="screen-name" th:text="${screen.name}"></span>
						</td>
						<td><span class="screen-type" th:text="${screen.type}"></span>
						</td>
						<td>
							<div class="action-cell">
								<a th:href="'/edit-screen/'+${screen.id}" class="btn-edit">✏️
									Edit</a> <a th:href="'/manage-seats/'+${screen.id}"
									class="btn-manage">🪑 Seats</a> <a
									th:href="'/delete-screen/'+${screen.id}" class="btn-delete"
									onclick="return confirm('Are you sure?');">🗑️ Delete</a> <a
									th:href="'/manage-shows/'+${screen.id}" class="btn-manage">Shows</a>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const toasts = document.querySelectorAll('.toastify');
			toasts.forEach(toastElement => {
				const closeBtn = document.createElement('button');
				closeBtn.className = 'toastify-close';
				closeBtn.innerHTML = '×';
				closeBtn.type = 'button';

				const spanElement = toastElement.querySelector('span');
				if (spanElement) {
					toastElement.insertBefore(closeBtn, spanElement.nextSibling);
				}

				closeBtn.addEventListener('click', () => {
					toastElement.style.animation = 'toastSlideOut 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
					setTimeout(() => toastElement.remove(), 400);
				});

				const timeout = setTimeout(() => {
					toastElement.style.animation = 'toastSlideOut 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
					setTimeout(() => toastElement.remove(), 400);
				}, 3500);

				closeBtn.addEventListener('click', () => clearTimeout(timeout));
			});
		});
	</script>

</body>
</html>
